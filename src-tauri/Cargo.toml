[package]
name = "crawlflow"
version = "0.1.0"
description = "CrawlFlow Desktop - Visual Web Crawler Configurator"
authors = ["you"]
license = ""
repository = ""
default-run = "crawlflow"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "crawlflow_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# GUI desktop app (default)
[[bin]]
name = "crawlflow"
path = "src/main.rs"

# Headless background service — NO Tauri, NO window, NO dock icon
[[bin]]
name = "crawlflow-service"
path = "src/bin/service.rs"

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }
pyo3-build-config = { version = "0.23", features = ["resolve-config"] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
reqwest = { version = "0.12", features = ["json", "blocking"] }
scraper = "0.22"
tokio = { version = "1", features = ["full"] }
pyo3 = { version = "0.23", features = ["abi3", "abi3-py39", "auto-initialize", "serde"] }
dirs-next = "2.0"
zip = "2.2"
calamine = "0.26"
rust_xlsxwriter = "0.82"
base64 = "0.22.1"
regex = "1"
lazy_static = "1.4"
tungstenite = "0.24"
tokio-tungstenite = "0.24"
futures-util = "0.3"
md5 = "0.7"
url = "2.5"
# Used by the headless service binary only
rusqlite = { version = "0.31", features = ["bundled"] }
ctrlc = { version = "3", features = ["termination"] }
