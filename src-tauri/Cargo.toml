[package]
name = "crawlflow"
version = "0.1.0"
description = "CrawlFlow Desktop - Visual Web Crawler Configurator"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "crawlflow_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
reqwest = { version = "0.12", features = ["json"] }
scraper = "0.22"
tokio = { version = "1", features = ["full"] }
pyo3 = { version = "0.23", features = ["auto-initialize", "extension-module", "serde"] }
dirs-next = "2.0"
